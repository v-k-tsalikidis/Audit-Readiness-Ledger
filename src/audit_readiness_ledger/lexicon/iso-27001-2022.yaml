# Control signatures for ISO/IEC 27001:2022 Annex A
#
# This file is the whole argument of the tool. Anyone can read it, disagree
# with a line, and change it. That is the point: an auditor asking "why did
# it say that?" gets a rule they can see, not a model output.
#
# How to read an entry
# --------------------
#   anchors: a list of groups. A group is satisfied when any one of its
#            terms appears in a document, matched whole and case-insensitively.
#   required: how many groups must be satisfied in the SAME document before
#            the control counts as addressed. Two is the normal setting: the
#            subject, plus something being done about it.
#   avoid:   terms that, on the same line, mean the hit is a different sense
#            of the word. "log" beside "logistics" is the standard example.
#
# What a match means
# ------------------
# That the set says something on the subject. Not that the control is met.
# The tool never claims the second, and neither should a report built on it.
#
# Coverage
# --------
# Signatures are written for the controls most often raised as findings.
# Controls with no entry are reported as "not assessed", never as gaps.

