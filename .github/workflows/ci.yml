name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install pinned packaging toolchain
        run: python -m pip install --upgrade pip==26.1.2

      - name: Install package
        run: python -m pip install -e ".[dev]"

      # Pinned to the versions the work was verified against. A pin to
      # anything else reproduces a result nobody has seen.
      - name: Install static analysis tools
        run: python -m pip install ruff==0.16.2 mypy==2.3.0

      - name: Lint
        run: python -m ruff check src tests scripts

      - name: Check formatting
        run: python -m ruff format --check src tests scripts

      - name: Type check
        run: python -m mypy src

      - name: Compile source and tests
        run: python -m compileall -q src tests scripts

      - name: Run tests
        run: python -m pytest tests -q

      # The report committed in examples/ is what the README tells people
      # they will get. Producing it here, through the installed command on
      # a clean machine, is the only way to know that stays true.
      - name: Reproduce the committed example report
        shell: bash
        run: |
          audit-readiness-ledger examples/meltemi-logistics/documents \
            --today 2026-08-10 \
            --output build/example-report.md
          tail -n +4 examples/meltemi-logistics/example-report.md > build/committed-body.md
          diff --unified build/committed-body.md build/example-report.md

      - name: Check the run is repeatable
        shell: bash
        run: |
          audit-readiness-ledger examples/meltemi-logistics/documents \
            --today 2026-08-10 --format json --output build/first.json
          audit-readiness-ledger examples/meltemi-logistics/documents \
            --today 2026-08-10 --format json --output build/second.json
          cmp build/first.json build/second.json

      - name: Finding gaps must not fail a run
        shell: bash
        run: |
          audit-readiness-ledger examples/meltemi-logistics/documents \
            --today 2026-08-10 > /dev/null
